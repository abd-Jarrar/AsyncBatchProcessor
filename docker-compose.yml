services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: async-batch-processor
    ports:
      - "5046:5046"
    environment:
      ASPNETCORE_HTTP_PORTS: 5046
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST},${DB_PORT};Database=${DB_NAME};User ID=${DB_USER};Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "${REDIS_CON}"
    volumes:
      - batch-data:/app/data
    networks:
      - app-network
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: async-batch-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: app-network

volumes:
  batch-data:
  redis-data: