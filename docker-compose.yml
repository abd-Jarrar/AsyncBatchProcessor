services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: async-batch-processor
    ports:
      - "5046:5046"
    environment:
      ASPNETCORE_HTTP_PORTS: 5046
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST},${DB_PORT};Database=${DB_NAME};User ID=${DB_USER};Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "${REDIS_CON}"
    volumes:
      - batch-data:/app/data
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5046/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: async-batch-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: app-network

volumes:
  batch-data:
  redis-data: