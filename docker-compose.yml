services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: async-batch-processor
    ports:
      - "5046:5046"
    environment:
      ASPNETCORE_HTTP_PORTS: 5046
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Asal.OrderManagementSystem;User ID=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
    volumes:
      - batch-data:/app/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: app-network

volumes:
  batch-data: